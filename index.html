<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sara Pilates">
<meta name="theme-color" content="#7b4fb5">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Sara Santos Pilates - Gestão de Alunos e Financeiro</title>
<style>
  :root{
    --bg:#e6d8f6;
    --surface:#ffffff;
    --ink:#2b2440;
    --muted:#6b6480;
    --line:#e4dced;
    --brand:#7b4fb5;
    --brand-dark:#5e3a8c;
    --pago-bg:#fdecec;      /* PAGO = vermelho (decisao confirmada) */
    --pago-border:#e74c3c;
    --pago-ink:#a12722;
    --pend-bg:#efe1fb;      /* PENDENTE = lilas/roxo claro */
    --pend-border:#9b59d0;
    --pend-ink:#6a2f9e;
    --green:#2e9e5b;
    --red:#e74c3c;
    --shadow:0 2px 10px rgba(70,40,110,.08);
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);
    font-size:17px;line-height:1.35;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3{margin:0 0 .4em;font-weight:700;}
  button{font-family:inherit;font-size:16px;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;font-size:16px;color:var(--ink);}

  /* ===== Header / Nav ===== */
  header{
    position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;box-shadow:var(--shadow);
  }
  .head-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .head-top .title{font-size:19px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:10px;}
  .head-top .title .logo{width:42px;height:42px;border-radius:50%;background:#fff;object-fit:contain;padding:4px;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.18);}
  .save-ind{font-size:13px;background:rgba(255,255,255,.18);padding:7px 12px;border-radius:999px;white-space:nowrap;}
  .save-ind.dirty{background:rgba(255,255,255,.30);}
  .head-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .year-sel{font-size:15px;font-weight:800;color:#fff;background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px;min-height:38px;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:center;}
  .year-sel option{color:#221a33;}
  .cfg-btn{width:38px;height:38px;min-height:38px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:19px;line-height:1;color:#fff;background:rgba(255,255,255,.15);border:2px solid #fff;border-radius:50%;cursor:pointer;padding:0;}
  .cfg-btn.active{background:#fff;color:var(--brand-dark);}
  nav{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
  nav button{
    flex:0 0 auto;background:rgba(255,255,255,.14);color:#fff;padding:11px 18px;border-radius:999px;
    font-weight:600;min-height:44px;
  }
  nav button.active{background:#fff;color:var(--brand-dark);}
  nav button.nav-agenda{background:#8fd4a3;color:#1c4d31;font-weight:800;box-shadow:0 2px 8px rgba(80,170,110,.35);}
  nav button.nav-agenda.active{background:#71c68b;color:#153d26;box-shadow:0 0 0 2px rgba(255,255,255,.9) inset,0 2px 8px rgba(80,170,110,.35);}

  /* ===== Layout ===== */
  main{max-width:1100px;margin:0 auto;padding:16px;}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px;}
  .section-title{font-size:16px;color:#120d22;margin-bottom:10px;font-weight:800;letter-spacing:0;}

  /* ===== Buttons ===== */
  .btn{background:var(--brand);color:#fff;padding:13px 20px;border-radius:12px;font-weight:700;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:#eee6f5;color:var(--brand-dark);}
  .btn.ghost{background:transparent;color:var(--brand-dark);border:2px solid var(--line);}
  .btn.danger{background:var(--red);color:#fff;}
  .btn.block{width:100%;}
  .btn[disabled]{opacity:.4;pointer-events:none;}

  /* ===== Indicators ===== */
  .grid{display:grid;gap:7px;}
  .grid.cards{grid-template-columns:repeat(auto-fit,minmax(118px,1fr));}
  .ind{background:var(--surface);border-radius:10px;box-shadow:0 1px 4px rgba(70,40,110,.07);padding:6px 9px;border-left:3px solid var(--brand);min-width:0;overflow:hidden;}
  .ind .lbl{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:1px;line-height:1.12;}
  .ind .val{font-size:13px;font-weight:800;line-height:1.18;white-space:nowrap;letter-spacing:-.2px;font-variant-numeric:tabular-nums;}
  .ind .val .cur{font-size:9px;font-weight:700;opacity:.75;margin-right:1px;vertical-align:.5px;}
  .ind.pos{border-left-color:var(--green);} .ind.pos .val{color:var(--green);}
  .ind.neg{border-left-color:var(--red);} .ind.neg .val{color:var(--red);}
  .ind.accent{border-left-color:var(--brand);}

  /* ===== Month selector ===== */
  .month-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .month-bar select{flex:1;min-width:150px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:18px;min-height:48px;}
  .month-bar .nav-arrow{background:#eee6f5;color:var(--brand-dark);width:48px;height:48px;border-radius:12px;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;}

  /* ===== Aluno cards ===== */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .search{flex:1;min-width:180px;position:relative;}
  .search input{width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:2px solid var(--line);background:#fff;min-height:48px;}
  .search:before{content:"\1F50E";position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5;}
  /* ===== Alunos: lista (uma linha por aluno) ===== */
  .aluno-list{display:flex;flex-direction:column;gap:10px;}
  .aluno{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;padding:10px 12px;border:2px solid var(--line);background:#fff;border-left-width:8px;}
  .aluno.pago{background:var(--pago-bg);border-color:var(--pago-border);border-left-color:var(--pago-border);}
  .aluno.pend{background:var(--pend-bg);border-color:var(--pend-border);border-left-color:var(--pend-border);}
  .aluno .nome{flex:1 1 auto;min-width:120px;font-weight:800;font-size:18px;color:#221a33;text-transform:capitalize;border:none;background:transparent;padding:9px 6px;border-bottom:2px dashed transparent;}
  .aluno .nome:focus{outline:none;border-bottom-color:var(--brand);}
  .aluno .f{padding:9px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;min-height:46px;flex:0 0 auto;}
  .aluno .f-dias{width:auto;}
  .aluno .f-valor{width:112px;text-align:right;}
  .aluno .f-forma{width:auto;}
  .aluno .f.warn{border-color:var(--red);background:#fff6f6;}
  .aluno .actions{display:flex;gap:6px;flex:0 0 auto;}
  .st-btn{padding:10px 14px;border-radius:10px;font-weight:700;min-height:46px;border:2px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap;}
  .st-btn.on-pago{background:var(--pago-border);color:#fff;border-color:var(--pago-border);}
  .st-btn.on-pend{background:var(--pend-border);color:#fff;border-color:var(--pend-border);}
  /* switch de status do aluno (aberto -> pago) */
  .st-switch{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;border:none;background:transparent;cursor:pointer;padding:6px 4px;min-height:46px;-webkit-appearance:none;appearance:none;}
  .st-track{position:relative;width:52px;height:28px;border-radius:14px;background:#c9c1d8;transition:background .15s;flex:0 0 auto;}
  .st-track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .15s;}
  .st-switch.pago .st-track{background:var(--pago-border);}
  .st-switch.pago .st-track::after{left:27px;}
  .st-switch-label{font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--muted);white-space:nowrap;}
  .st-switch.pago .st-switch-label{color:var(--pago-border);}
  .icon-btn{width:46px;height:46px;border-radius:10px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;}
  .icon-btn.del{color:var(--red);}

  /* ===== Finance lists (linha colorida por status) ===== */
  .line-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-bottom:8px;border-radius:10px;border:2px solid var(--line);border-left-width:8px;background:#fff;}
  .line-item.pago{background:var(--pago-bg);border-color:var(--pago-border);border-left-color:var(--pago-border);}
  .line-item.pend{background:var(--pend-bg);border-color:var(--pend-border);border-left-color:var(--pend-border);}
  .line-item input{padding:10px;border-radius:10px;border:2px solid var(--line);background:#fff;min-height:44px;}
  .line-item .li-desc{flex:1 1 200px;min-width:150px;}
  .line-item .li-valor{flex:0 0 130px;}
  .line-item .st-toggle{padding:10px 14px;border-radius:999px;font-weight:800;font-size:13px;min-height:44px;border:2px solid transparent;white-space:nowrap;color:#fff;}
  .st-toggle.pago{background:var(--pago-border);}
  .st-toggle.pend{background:var(--pend-border);}
  .line-item .icon-btn{margin-left:auto;}
  @media(max-width:560px){
    .line-item .li-valor{flex:1 1 100px;}
    .line-item .st-toggle{margin-left:auto;}
  }
  /* ===== Poupança ===== */
  .poup-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-bottom:8px;border-radius:10px;border:2px solid var(--line);border-left-width:8px;background:#fff;}
  .poup-item.dep{border-left-color:#2e7d46;}
  .poup-item.saque{border-left-color:#e67e22;}
  .poup-item input{padding:10px;border-radius:10px;border:2px solid var(--line);background:#fff;min-height:44px;}
  .poup-item .li-desc{flex:1 1 180px;min-width:140px;}
  .poup-item .li-valor{flex:0 0 130px;}
  .poup-item .icon-btn{margin-left:auto;}
  .poup-tag{flex:0 0 auto;font-size:11px;font-weight:800;padding:6px 10px;border-radius:999px;letter-spacing:.5px;}
  .poup-item.dep .poup-tag{background:#dff0e4;color:#1f6b3a;}
  .poup-item.saque .poup-tag{background:#fdead2;color:#8a5a12;}
  .poup-bal{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:#efe7fb;border:2px solid #d9c9f2;margin-bottom:10px;}
  .poup-bal .lbl{font-weight:700;color:var(--ink);}
  .poup-bal .val{font-weight:800;font-size:18px;}
  .poup-bal.neg .val{color:var(--pend-border,#b23b3b);}
  .ind.poup{border-left-color:#5aa0d6;}
  @media(max-width:560px){ .poup-item .li-valor{flex:1 1 100px;} }

  /* ===== Table (Caixa) ===== */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;min-width:560px;}
  th,td{padding:12px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:700;}
  thead th{background:#f0e9f8;color:var(--brand-dark);font-size:13px;text-transform:uppercase;letter-spacing:.4px;}
  tr.total-row td{font-weight:800;background:#f0e9f8;border-top:2px solid var(--brand);}
  td.warn{color:var(--red);font-weight:700;}
  .row-click{cursor:pointer;} .row-click:active{background:#faf6ff;}

  /* ===== Gráficos (SVG) ===== */
  .chart{width:100%;height:auto;display:block;}
  .c-grid{stroke:#e4dced;stroke-width:1;}
  .c-xlab{font-size:16px;fill:#6b6480;}
  .c-ylab{font-size:14px;fill:#6b6480;}
  .c-vlab{font-size:12px;font-weight:800;}
  .c-vlab.line{font-size:10.5px;}
  .chart-legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;font-weight:600;color:var(--ink);}
  .chart-legend .lg{display:flex;align-items:center;gap:7px;}
  .chart-legend i{width:15px;height:15px;border-radius:4px;display:inline-block;}

  /* ===== Backup por texto ===== */
  .ta-backup{width:100%;box-sizing:border-box;min-height:120px;margin-top:10px;padding:10px;border:2px solid var(--line);border-radius:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.4;background:#fff;resize:vertical;-webkit-user-select:text;user-select:text;}

  /* ===== Config ===== */
  .cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .cfg-item label{font-size:13px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px;}
  .cfg-item input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);min-height:48px;font-weight:700;font-size:18px;}
  .cfg-mens{grid-template-columns:repeat(4,1fr);gap:8px;}
  .cfg-mens .cfg-item{min-width:0;}
  .cfg-mens .cfg-item label{font-size:12px;margin-bottom:3px;}
  .cfg-mens .cfg-item input{padding:9px 8px;min-height:42px;font-size:14px;}
  .pill{display:inline-block;background:#eee6f5;color:var(--brand-dark);padding:8px 14px;border-radius:999px;font-weight:700;margin:0 8px 8px 0;}
  .hint{font-size:13px;color:var(--muted);margin-top:8px;}

  /* ===== Modal ===== */
  .overlay{position:fixed;inset:0;background:rgba(43,36,64,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .modal{background:#fff;border-radius:18px;padding:22px;max-width:420px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal.modal-wide{max-width:600px;}
  .modal h3{font-size:19px;}
  .modal p{color:var(--muted);}
  .modal input{width:100%;padding:13px;border-radius:12px;border:2px solid var(--line);min-height:50px;margin-top:12px;font-size:17px;}
  .modal .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal .modal-actions .btn{flex:1;}

  /* ===== Agenda ===== */
  .ag-topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .ag-topbar .nav-arrow{background:#eee6f5;color:var(--brand-dark);width:46px;height:46px;border-radius:12px;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .ag-title{flex:1;text-align:center;font-size:18px;font-weight:800;color:#120d22;}
  .ag-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .ag-actions .btn{padding:11px 14px;min-height:46px;font-size:15px;}
  .ag-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .ag-table{width:100%;border-collapse:separate;border-spacing:0;min-width:760px;table-layout:fixed;}
  .ag-table th,.ag-table td{border:1px solid var(--line);}
  .ag-table thead th{background:#f1e8fb;padding:6px;}
  .ag-day{font-weight:800;color:#120d22;text-align:center;font-size:13px;white-space:nowrap;}
  .ag-time,.ag-corner{width:96px;}
  .ag-time{background:#f1e8fb;font-weight:900;color:#120d22;text-align:center;vertical-align:middle;font-size:18px;letter-spacing:.3px;}
  .ag-corner{background:#fff;}
  .ag-corner-in{display:flex;align-items:center;gap:6px;justify-content:center;}
  .ag-corner-in img{width:30px;height:30px;object-fit:contain;flex:0 0 auto;}
  .ag-brand{display:flex;flex-direction:column;line-height:1.05;font-weight:800;color:var(--brand-dark);font-size:13px;}
  .ag-cell{vertical-align:top;padding:0;background:#fff;}
  .ag-line{border-bottom:1px solid var(--line);display:flex;align-items:center;}
  .ag-line:last-child{border-bottom:none;}
  .ag-name{flex:1;min-width:0;border:none;padding:6px 5px;font-size:14px;min-height:32px;background:transparent;color:var(--ink);display:block;}
  .ag-name:focus{outline:none;background:transparent;}
  /* interruptor de presença por linha (neutro → veio → faltou) */
  .ag-att{flex:0 0 auto;width:40px;height:22px;border-radius:11px;border:none;margin:0 6px 0 4px;background:#cbc3d9;position:relative;cursor:pointer;padding:0;-webkit-appearance:none;appearance:none;}
  .ag-att::after{content:"";position:absolute;top:2px;left:11px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:left .15s,background .15s;}
  .ag-att.on{background:#2e7d46;}
  .ag-att.on::after{left:20px;}
  .ag-att.off{background:#d9534f;}
  .ag-att.off::after{left:2px;}
  .ag-table .ag-cell .ag-line.att-on{background:#2e7d46;}
  .ag-line.att-on .ag-name{color:#fff;font-weight:800;}
  .ag-line.att-on .ag-name::placeholder{color:#d8ecdf;}
  .ag-table .ag-cell .ag-line.att-off{background:#f6bcbc;}
  .ag-line.att-off .ag-name{color:#7a1f1f;}
  .ag-cell.closed{background:var(--brand);padding:0;}
  .ag-closed-tag{display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:800;font-size:13px;min-height:100px;letter-spacing:.5px;pointer-events:none;}
  /* destaque cruzado (linha + coluna) ao focar uma célula */
  .ag-hl-col{box-shadow:inset 2px 0 0 0 var(--brand),inset -2px 0 0 0 var(--brand);}
  .ag-hl-row{box-shadow:inset 0 2px 0 0 var(--brand),inset 0 -2px 0 0 var(--brand);}
  .ag-hl-col.ag-hl-row{box-shadow:inset 2px 2px 0 0 var(--brand),inset -2px -2px 0 0 var(--brand);}
  .ag-table th.ag-hl-head{background:#8fd4a3;color:#153d26;}
  .ag-table .ag-line.ag-hl-line{background:#8fd4a3;}
  .modal select{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);min-height:48px;margin-top:6px;font-size:16px;background:#fff;}
  .modal .mlbl{display:block;margin-top:12px;font-weight:700;font-size:14px;color:var(--ink);}
  .ag-openlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px;margin-top:8px;padding:2px;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .ag-openrow{display:flex;align-items:center;gap:8px;padding:8px 8px;border:1px solid var(--line);border-radius:8px;background:#faf7fe;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;}
  .ag-openrow input{width:20px;height:20px;flex:0 0 auto;}

  /* ===== Reminder (backup) ===== */
  .reminder{border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:14px;line-height:1.4;border:1.5px solid var(--line);}
  .reminder.warn{background:#fff7e6;border-color:#f0c675;color:#7a5200;}
  .reminder.ok{background:#e9f7ee;border-color:#bfe6cd;color:#256b40;}

  /* ===== Toast ===== */
  #toasts{position:fixed;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none;}
  .toast{background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .2s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>

<script>
"use strict";
/* =========================================================================
   Pilates Manager — app 100% local, single-file, IndexedDB.
   Dinheiro em CENTAVOS (inteiros) para evitar erro de ponto flutuante.
   ========================================================================= */
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const FORMAS = [["","—"],["PIX","PIX"],["DINHEIRO","Dinheiro"],["CARTAO","Cartão"]];
const DEFAULT_CONFIG = {1:12000, 2:18000, 3:22000, 4:33000};
const START_YEAR = 2026;
const APP_VERSION = "2.8";
const APP_BUILD = "30/07/2026";
const AG_TIMES = ["08","09","10","14","15","16","17","18","19","20","21"];
const AG_DAYS = ["Segunda","Terça","Quarta","Quinta","Sexta"];

let db = null;
let state = null;          // { config:{1..4}, meses:[12] }
let view = "dashboard";
let curMonth = new Date().getMonth();
let curYear = Math.max(START_YEAR, new Date().getFullYear());
let agWeekMon = null;      // Date: segunda-feira da semana exibida na Agenda
let saveTimer = null;
let storageMode = "mem";   // 'idb' | 'ls' | 'mem'
function withTimeout(promise, ms){ return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")), ms))]); }

/* ---------- Utils ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function fmt(cents){ if(cents==null||isNaN(cents)) return ""; return (cents/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function fmt0(cents){ return (( cents||0)/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function fmtCard(cents){ return fmt0(cents).replace(/(R\$)\s?/, '<span class="cur">$1</span> '); }
function parseCents(str){
  if(typeof str === "number") return Math.round(str*100);
  if(str==null) return null;
  let s = String(str).trim().replace(/[R$\s]/g,"");
  if(s==="") return null;
  if(s.indexOf(",")>=0){ s = s.replace(/\./g,"").replace(",","."); }
  const n = parseFloat(s);
  if(isNaN(n)) return null;
  return Math.round(n*100);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- IndexedDB (single key store) ---------- */
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open("pilates_db", 1);
    r.onupgradeneeded = e => { const d=e.target.result; if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv"); };
    r.onsuccess = e => res(e.target.result);
    r.onerror  = e => rej(e.target.error);
  });
}
function dbGet(key){
  return new Promise((res,rej)=>{ const t=db.transaction("kv","readonly").objectStore("kv").get(key); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); });
}
function dbSet(key,val){
  return new Promise((res,rej)=>{ const t=db.transaction("kv","readwrite").objectStore("kv").put(val,key); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); });
}

/* ---------- State ---------- */
function emptyMonth(){ return { alunos:[], receitasExtras:[], despesas:[], poupanca:[] }; }
function emptyYear(){ return { meses: Array.from({length:12}, emptyMonth) }; }
function initState(){ state = { meta:{lastBackup:null,lastAutoBackup:null}, config:{...DEFAULT_CONFIG}, anos:{ [START_YEAR]: emptyYear() }, agenda:{weeks:{}} }; }
function ensureShape(){
  if(!state) initState();
  if(!state.meta || typeof state.meta!=="object") state.meta = {};
  if(!("lastBackup" in state.meta)) state.meta.lastBackup = null;
  if(!("lastAutoBackup" in state.meta)) state.meta.lastAutoBackup = null;
  if(!state.config) state.config = {...DEFAULT_CONFIG};
  for(const k of [1,2,3,4]) if(state.config[k]==null) state.config[k]=DEFAULT_CONFIG[k];
  // Migração: modelo antigo (state.meses, ano único) -> multi-ano (state.anos)
  if(!state.anos || typeof state.anos!=="object"){
    state.anos={};
    if(Array.isArray(state.meses)) state.anos[START_YEAR]={meses:state.meses};
  }
  if(Array.isArray(state.meses)) delete state.meses;
  if(Object.keys(state.anos).length===0) state.anos[START_YEAR]=emptyYear();
  for(const y of Object.keys(state.anos)) normalizaAno(state.anos[y]);
  if(!state.agenda || typeof state.agenda!=="object") state.agenda={weeks:{}};
  if(!state.agenda.weeks || typeof state.agenda.weeks!=="object") state.agenda.weeks={};
  seedHistorico2026();
}
/* Consolidado histórico do 1º semestre de 2026 (semeado uma única vez; valores em centavos) */
function seedHistorico2026(){
  if(state.meta.seedHist2026) return;
  const ano=state.anos["2026"];
  if(ano && Array.isArray(ano.meses)){
    const hist=[
      {pago:651500,pix:524500,din:127000,cart:0,    cTotal:41}, // Janeiro
      {pago:800000,pix:612000,din:188000,cart:0,    cTotal:51}, // Fevereiro
      {pago:908000,pix:776000,din:120500,cart:11500,cTotal:58}, // Março
      {pago:894000,pix:717500,din:165000,cart:11500,cTotal:56}, // Abril
      {pago:884000,pix:707500,din:165000,cart:11500,cTotal:58}, // Maio
      {pago:917000,pix:768500,din:137000,cart:11500,cTotal:59}  // Junho
    ];
    for(let i=0;i<6;i++){
      const mm=ano.meses[i];
      if(mm && Array.isArray(mm.alunos) && mm.alunos.length===0 && !mm.consolidado){
        mm.consolidado={...hist[i]};
      }
    }
  }
  state.meta.seedHist2026=true;
}
function normalizaAno(ano){
  if(!ano || typeof ano!=="object") return;
  if(!Array.isArray(ano.meses)) ano.meses=Array.from({length:12}, emptyMonth);
  for(let i=0;i<12;i++){
    if(!ano.meses[i]) ano.meses[i]=emptyMonth();
    const mm=ano.meses[i];
    if(!Array.isArray(mm.alunos)) mm.alunos=[];
    if(!Array.isArray(mm.receitasExtras)) mm.receitasExtras=[];
    if(!Array.isArray(mm.despesas)) mm.despesas=[];
    if(!Array.isArray(mm.poupanca)) mm.poupanca=[];
  }
}
function getAno(y){
  if(!state.anos[y]) state.anos[y]=emptyYear();
  normalizaAno(state.anos[y]);
  return state.anos[y];
}
function curMeses(){ return getAno(curYear).meses; }
async function persistNow(){
  try{
    if(storageMode==="mem") return;                 // sessão: nada a persistir
    const json=JSON.stringify(state);
    if(storageMode==="idb" && db){
      await dbSet("state", state);
      try{ localStorage.setItem("pilates_state", json); }catch(e){}  // cópia redundante de segurança
    } else {
      localStorage.setItem("pilates_state", json);
    }
  }catch(e){ console.warn("Falha ao salvar:", e); }
}
function setSaved(saved){
  const el = document.getElementById("saveInd");
  if(!el) return;
  if(saved){ el.textContent="✓ Salvo"; el.classList.remove("dirty"); }
  else { el.textContent="● Alterações não salvas"; el.classList.add("dirty"); }
}
function touch(){
  setSaved(false);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{ await persistNow(); setSaved(true); }, 250);
}

/* ---------- Computations ---------- */
function valorAluno(a){ return a.valor==null?0:a.valor; }
function despesaValida(d){ return (d.descricao && d.descricao.trim()!=="") || (d.valor && d.valor>0); }

function totaisMes(m){
  let total=0,pago=0,receber=0,cPago=0,cPend=0,pix=0,din=0,cart=0,cTotal=m.alunos.length;
  for(const a of m.alunos){
    const v=valorAluno(a); total+=v;
    if(a.status==="PAGO"){
      pago+=v; cPago++;
      if(a.formaPagamento==="PIX") pix+=v;
      else if(a.formaPagamento==="DINHEIRO") din+=v;
      else if(a.formaPagamento==="CARTAO") cart+=v;
    } else { receber+=v; cPend++; }
  }
  // Consolidado histórico: meses sem alunos cadastrados usam os valores lançados manualmente
  const cs=m.consolidado;
  if(cs && m.alunos.length===0){
    pago=cs.pago||0; pix=cs.pix||0; din=cs.din||0; cart=cs.cart||0;
    total=pago; receber=0; cPago=cs.cTotal||0; cPend=0; cTotal=cs.cTotal||0;
  }
  const outras=(m.receitasExtras||[]).reduce((s,r)=>s+(r.valor||0),0);
  let despPagas=0,despPend=0;
  for(const d of m.despesas){
    if(!despesaValida(d)) continue;
    if(d.status==="PAGO") despPagas+=d.valor||0; else despPend+=d.valor||0;
  }
  const entradas=pago+outras;
  const pou=movsPoupanca(m);
  return {
    total,pago,receber,cPago,cPend,cTotal,
    pix,din,cart,formaSoma:pix+din+cart,
    salarioSara:pago,outras,entradas,
    despPagas,despPend,
    poupDep:pou.dep,poupSaque:pou.saq,poupLiq:pou.liq,
    saldoMes:entradas-despPagas-pou.liq
  };
}
/* Movimentações de poupança do mês (líquido = depósitos - saques) */
function movsPoupanca(m){
  let dep=0,saq=0;
  for(const p of (m.poupanca||[])){
    if(!p || !(p.valor>0)) continue;
    if(p.tipo==="SAQUE") saq+=p.valor; else dep+=p.valor;
  }
  return {dep,saq,liq:dep-saq};
}
/* Saldo acumulado da poupança até (ano, mês) — cronológico e contínuo entre anos */
function saldoPoupancaAte(year,monthIdx){
  let s=0;
  const anos=Object.keys(state.anos||{}).map(Number).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
  for(const y of anos){
    if(y>year) continue;
    const meses=getAno(y).meses;
    const last=(y<year)?11:monthIdx;
    for(let i=0;i<=last && i<12;i++) s+=movsPoupanca(meses[i]).liq;
  }
  return s;
}
function saldoAcumuladoAte(idx){ const meses=curMeses(); let s=0; for(let i=0;i<=idx;i++) s+=totaisMes(meses[i]).saldoMes; return s; }
function totaisAno(){
  let pago=0,pix=0,din=0,cart=0,despPagas=0;
  const meses=curMeses();
  for(let i=0;i<12;i++){ const t=totaisMes(meses[i]); pago+=t.pago;pix+=t.pix;din+=t.din;cart+=t.cart;despPagas+=t.despPagas; }
  return {pago,pix,din,cart,despPagas,saldo:saldoAcumuladoAte(11)};
}

/* ----- Seletor de ano ----- */
function anosDisponiveis(){
  const cy=new Date().getFullYear();
  const set=new Set();
  set.add(curYear);
  Object.keys(state.anos||{}).forEach(y=>{ const n=parseInt(y,10); if(!isNaN(n)) set.add(n); });
  let maxData=START_YEAR;
  set.forEach(y=>{ if(y>maxData) maxData=y; });
  // Sempre oferece de 2026 até (ano corrente+1) e até (maior ano com dados + 1),
  // permitindo criar o próximo ano quando quiser.
  const teto=Math.max(cy+1, maxData+1, START_YEAR+1);
  for(let y=START_YEAR; y<=teto; y++) set.add(y);
  return [...set].filter(y=>y>=START_YEAR).sort((a,b)=>a-b);
}
function refreshYearSel(){
  const sel=document.getElementById("yearSel"); if(!sel) return;
  sel.innerHTML = anosDisponiveis().map(y=>`<option value="${y}" ${y===curYear?"selected":""}>${y}</option>`).join("");
}

/* ----- Caixa ----- */
function fmtR(reais){ return "R$ " + Math.round(reais).toLocaleString("pt-BR"); }

/* Gráfico de barras (SVG puro, sem dependências) */
function svgBars(labels, values, color, fmtTick){
  const W=760,H=260,padL=64,padR=18,padT=18,padB=40;
  const n=labels.length, plotW=W-padL-padR, plotH=H-padT-padB;
  const maxV=niceMax(Math.max(1,...values));
  const step=plotW/n, bw=step*0.58;
  let grid="",bars="",xlab="",vlab="";
  [0,0.5,1].forEach(f=>{
    const y=padT+plotH-plotH*f;
    grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" class="c-grid"/>`;
    grid+=`<text x="${padL-8}" y="${(y+5).toFixed(1)}" text-anchor="end" class="c-ylab">${fmtTick(maxV*f)}</text>`;
  });
  values.forEach((v,i)=>{
    const h=maxV>0?(v/maxV)*plotH:0;
    const cx=padL+step*i+step/2, x=padL+step*i+(step-bw)/2, y=padT+plotH-h;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="4" fill="${color}"><title>${labels[i]}: ${fmtTick(v)}</title></rect>`;
    if(v>0) vlab+=`<text x="${cx.toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" class="c-vlab" fill="${color}">${fmtTick(v)}</text>`;
    xlab+=`<text x="${cx.toFixed(1)}" y="${H-padB+22}" text-anchor="middle" class="c-xlab">${labels[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" preserveAspectRatio="xMidYMid meet">${grid}${bars}${vlab}${xlab}</svg>`;
}

/* Gráfico de linhas multi-série (SVG puro) */
function svgLines(labels, series, fmtTick){
  const W=760,H=260,padL=64,padR=18,padT=18,padB=40;
  const n=labels.length, plotW=W-padL-padR, plotH=H-padT-padB;
  let mx=1; series.forEach(s=>s.values.forEach(v=>{ if(v>mx) mx=v; }));
  const maxV=niceMax(mx);
  const xAt=i=> padL + (n<=1?plotW/2:(plotW*i/(n-1)));
  const yAt=v=> padT+plotH-(maxV>0?(v/maxV)*plotH:0);
  let grid="",xlab="";
  [0,0.5,1].forEach(f=>{
    const y=padT+plotH-plotH*f;
    grid+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" class="c-grid"/>`;
    grid+=`<text x="${padL-8}" y="${(y+5).toFixed(1)}" text-anchor="end" class="c-ylab">${fmtTick(maxV*f)}</text>`;
  });
  labels.forEach((lb,i)=> xlab+=`<text x="${xAt(i).toFixed(1)}" y="${H-padB+22}" text-anchor="middle" class="c-xlab">${lb}</text>`);
  let paths="",dots="",vlab="";
  series.forEach(s=>{
    let d="";
    s.values.forEach((v,i)=>{ d+=(i===0?"M":"L")+xAt(i).toFixed(1)+" "+yAt(v).toFixed(1)+" ";
      dots+=`<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(v).toFixed(1)}" r="3.5" fill="${s.color}"><title>${s.name} — ${labels[i]}: ${fmtTick(v)}</title></circle>`;
      if(v>0) vlab+=`<text x="${xAt(i).toFixed(1)}" y="${(yAt(v)-7).toFixed(1)}" text-anchor="middle" class="c-vlab line" fill="${s.color}">${fmtTick(v)}</text>`; });
    paths+=`<path d="${d.trim()}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" preserveAspectRatio="xMidYMid meet">${grid}${paths}${dots}${vlab}${xlab}</svg>`;
}

/* Contagem de presença por mês (Agenda): 'on' = presente, 'off' = ausente; neutro não conta.
   A semana pertence ao mês da quinta-feira (mesma convenção do título da Agenda). */
function presencaPorMes(year){
  const out=Array.from({length:12},()=>({on:0,off:0}));
  const weeks=state.agenda.weeks||{};
  for(const key of Object.keys(weeks)){
    const w=weeks[key];
    if(!w||!w.attend) continue;
    const [yy,mm,dd]=key.split("-").map(Number);
    const thu=addDays(new Date(yy,mm-1,dd),3);
    if(thu.getFullYear()!==year) continue;
    const mo=thu.getMonth();
    for(const cell of Object.values(w.attend)){
      if(!Array.isArray(cell)) continue;
      for(const st of cell){
        if(st==="on") out[mo].on++;
        else if(st==="off") out[mo].off++;
      }
    }
  }
  return out;
}
/* Barras horizontais 100%: verde = % presentes, vermelho = % ausentes */
function svgPresenca(labels,data){
  const W=760,padL=64,padR=64,padT=18,rowH=34,barH=20;
  const H=padT+labels.length*rowH+8;
  const barW=W-padL-padR;
  let s="";
  data.forEach((d,i)=>{
    const cy=padT+i*rowH+rowH/2;
    s+=`<text x="${padL-8}" y="${(cy+4).toFixed(1)}" text-anchor="end" class="c-xlab" font-weight="700">${labels[i].slice(0,3)}</text>`;
    if(d.on+d.off===0){
      s+=`<rect x="${padL}" y="${(cy-barH/2).toFixed(1)}" width="${barW}" height="${barH}" fill="#e4dced"><title>${labels[i]}: sem dados de presença</title></rect>`;
      s+=`<text x="${(padL+barW+8).toFixed(1)}" y="${(cy+4).toFixed(1)}" text-anchor="start" class="c-vlab" fill="#c9c1d8">—</text>`;
      return;
    }
    const pct=Math.round(d.on/(d.on+d.off)*100);
    const gw=barW*pct/100, rw=barW-gw;
    if(gw>0) s+=`<rect x="${padL}" y="${(cy-barH/2).toFixed(1)}" width="${gw.toFixed(1)}" height="${barH}" fill="#2e9e5b"><title>${labels[i]}: ${d.on} presentes (${pct}%)</title></rect>`;
    if(rw>0) s+=`<rect x="${(padL+gw).toFixed(1)}" y="${(cy-barH/2).toFixed(1)}" width="${rw.toFixed(1)}" height="${barH}" fill="#e74c3c"><title>${labels[i]}: ${d.off} ausentes (${100-pct}%)</title></rect>`;
    s+=`<text x="${(padL+barW+8).toFixed(1)}" y="${(cy+4).toFixed(1)}" text-anchor="start" class="c-vlab" fill="#6b6480">${pct}%</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
}

function niceMax(v){
  if(!isFinite(v)||v<=0) return 1;
  const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p;
  let m; if(n<=1)m=1; else if(n<=2)m=2; else if(n<=2.5)m=2.5; else if(n<=5)m=5; else m=10;
  return m*p;
}

/* =========================================================================
   AGENDA (grade semanal de horários)
   ========================================================================= */
function logoSrc(){ const el=document.querySelector("header .head-top .title .logo"); return el?el.src:""; }
function pad2(n){ return String(n).padStart(2,"0"); }
function mondayOf(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const wd=(d.getDay()+6)%7;                 // Segunda=0 ... Domingo=6
  d.setDate(d.getDate()-wd);
  return d;
}
function addDays(date,n){ const d=new Date(date); d.setDate(d.getDate()+n); return d; }
function agWeekKey(mon){ return `${mon.getFullYear()}-${pad2(mon.getMonth()+1)}-${pad2(mon.getDate())}`; }
function ensureAgWeek(){ if(!agWeekMon) agWeekMon=mondayOf(new Date()); }
function emptyAgWeek(){ return { cells:{}, closed:{}, attend:{} }; }
function getAgWeek(mon){
  const key=agWeekKey(mon);
  if(!state.agenda.weeks[key]) state.agenda.weeks[key]=emptyAgWeek();
  const w=state.agenda.weeks[key];
  if(!w.cells) w.cells={};
  if(!w.closed) w.closed={};
  if(!w.attend) w.attend={};
  return w;
}
function agKey(d,t){ return d+"_"+t; }
function agNames(w,d,t){ return w.cells[agKey(d,t)] || ["","",""]; }
function agClosed(w,d,t){ return !!w.closed[agKey(d,t)]; }
function agAttend(w,d,t){ return w.attend[agKey(d,t)] || ["","",""]; }
function cycleAgAttend(d,t,line){
  const w=getAgWeek(agWeekMon), k=agKey(d,t);
  if(!Array.isArray(w.attend[k])) w.attend[k]=["","",""];
  const next={"":"on","on":"off","off":""};
  w.attend[k][line]=next[w.attend[k][line]||""];
  touch();
  return w.attend[k][line];
}
function agWeekTitle(mon){
  const thu=addDays(mon,3);                  // quinta define o mês (ISO)
  const month=thu.getMonth(), year=thu.getFullYear();
  const firstMon=mondayOf(new Date(year,month,1));
  const wnum=Math.round((mon-firstMon)/(7*86400000))+1;
  const fri=addDays(mon,4);
  return `${MESES[month]} - semana ${wnum} - ${pad2(mon.getDate())} a ${pad2(fri.getDate())}`;
}

function setAgendaName(d,t,line,val){
  const w=getAgWeek(agWeekMon); const k=agKey(d,t);
  if(!w.cells[k]) w.cells[k]=["","",""];
  w.cells[k][line]=val; touch();
}
function fecharHorario(d,t){ const w=getAgWeek(agWeekMon); w.closed[agKey(d,t)]=true; touch(); render(); toast(`Horário fechado: ${AG_DAYS[d]} ${t}h.`); }
function abrirHorarios(keys){ const w=getAgWeek(agWeekMon); keys.forEach(k=>{ delete w.closed[k]; }); touch(); render(); toast("Horário(s) reaberto(s)."); }

async function agendaFecharDialog(){
  const dopts=AG_DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join("");
  const topts=AG_TIMES.map(t=>`<option value="${t}">${t}h</option>`).join("");
  const html=`<h3>Fechar horário</h3>
    <p>Selecione o dia e o horário. A célula ficará bloqueada (sem inserir nomes).</p>
    <label class="mlbl">Dia da semana</label><select id="fdia">${dopts}</select>
    <label class="mlbl">Horário</label><select id="fhora">${topts}</select>
    <div class="modal-actions"><button class="btn ghost" data-mres="null">Cancelar</button><button class="btn" data-mres="ok">Fechar horário</button></div>`;
  const r=await modalForm(html);
  if(r.res==="ok"){ fecharHorario(parseInt(r.form.fdia,10), r.form.fhora); }
}
async function agendaAbrirDialog(){
  const w=getAgWeek(agWeekMon);
  const keys=Object.keys(w.closed).filter(k=>w.closed[k]);
  if(!keys.length){
    await modal(`<h3>Abrir horário</h3><p>Não há horários fechados nesta semana.</p>
      <div class="modal-actions"><button class="btn" data-mres="ok">Ok</button></div>`);
    return;
  }
  keys.sort();
  const rows=keys.map(k=>{ const [d,t]=k.split("_"); return `<label class="ag-openrow"><input type="checkbox" data-openkey="${k}"> ${AG_DAYS[+d]} — ${t}h</label>`; }).join("");
  const sel=await modalOpenSlots(`<h3>Abrir horário</h3><p>Selecione os horários fechados que deseja reabrir.</p>
    <div class="ag-openlist">${rows}</div>
    <div class="modal-actions"><button class="btn ghost" data-mres="null">Cancelar</button><button class="btn" data-mres="ok">Abrir selecionados</button></div>`);
  if(sel && sel.length){ abrirHorarios(sel); }
}
function modalOpenSlots(html){
  return new Promise(resolve=>{
    const ov=document.createElement("div"); ov.className="overlay"; ov.innerHTML=`<div class="modal modal-wide">${html}</div>`;
    document.body.appendChild(ov);
    const finish=ok=>{
      let out=null;
      if(ok){ out=[...ov.querySelectorAll("input[data-openkey]:checked")].map(i=>i.dataset.openkey); }
      ov.remove(); resolve(out);
    };
    ov.addEventListener("click",e=>{ if(e.target===ov) finish(false); });
    ov.querySelectorAll("[data-mres]").forEach(b=>b.addEventListener("click",()=>finish(b.dataset.mres==="ok")));
  });
}
async function agendaMigrar(){
  const w=getAgWeek(agWeekMon);
  const prox=addDays(agWeekMon,7);
  const nk=agWeekKey(prox);
  const dest=state.agenda.weeks[nk];
  const destComDados = dest && (
    Object.values(dest.cells||{}).some(a=>a.some(x=>x&&x.trim())) ||
    Object.keys(dest.closed||{}).length>0
  );
  if(destComDados){
    if(!await confirmDialog("A próxima semana já possui dados. Deseja substituí-los pelos nomes desta semana?")) return;
  }
  state.agenda.weeks[nk]=JSON.parse(JSON.stringify({cells:w.cells, closed:w.closed}));
  agWeekMon=prox; touch(); render();
  toast("Nomes migrados para a próxima semana.");
}

function renderAgenda(){
  ensureAgWeek();
  const w=getAgWeek(agWeekMon);
  const title=agWeekTitle(agWeekMon);
  const logo=logoSrc();
  let head=`<tr><th class="ag-corner"><div class="ag-corner-in"><img src="${logo}" alt=""><div class="ag-brand"><span>Sara</span><span>Santos</span></div></div></th>`;
  for(let d=0; d<AG_DAYS.length; d++){ const dd=String(addDays(agWeekMon,d).getDate()).padStart(2,"0"); head+=`<th class="ag-day" data-day="${d}">${AG_DAYS[d].toUpperCase()}-${dd}</th>`; }
  head+=`</tr>`;
  let body="";
  for(const t of AG_TIMES){
    body+=`<tr><th class="ag-time" data-time="${t}">${t}h</th>`;
    for(let d=0; d<AG_DAYS.length; d++){
      if(agClosed(w,d,t)){
        body+=`<td class="ag-cell closed" data-day="${d}" data-time="${t}"><div class="ag-closed-tag">🔒 FECHADO</div></td>`;
      } else {
        const nm=agNames(w,d,t);
        const at=agAttend(w,d,t);
        let lines="";
        for(let l=0;l<3;l++){
          const st=at[l]||"";
          const lineCls=st==="on"?" att-on":st==="off"?" att-off":"";
          const btnCls=st==="on"?"on":st==="off"?"off":"";
          lines+=`<div class="ag-line${lineCls}"><button class="ag-att ${btnCls}" data-action="agenda-att" data-day="${d}" data-time="${t}" data-line="${l}" title="Presença: neutro → veio → faltou" aria-label="Presença do aluno"></button><input class="ag-name" type="text" data-live="agenda-cell" data-day="${d}" data-time="${t}" data-line="${l}" value="${esc(nm[l]||"")}"></div>`;
        }
        body+=`<td class="ag-cell" data-day="${d}" data-time="${t}">${lines}</td>`;
      }
    }
    body+=`</tr>`;
  }
  return `
  <div class="card">
    <div class="ag-topbar">
      <button class="nav-arrow" data-action="sem-prev" title="Semana anterior">‹</button>
      <div class="ag-title">${title}</div>
      <button class="nav-arrow" data-action="sem-next" title="Próxima semana">›</button>
    </div>
    <div class="ag-actions">
      <button class="btn secondary" data-action="agenda-fechar">🔒 Fechar horário</button>
      <button class="btn ghost" data-action="agenda-abrir">🔓 Abrir horário</button>
      <button class="btn" data-action="agenda-migrar">➡ Migrar</button>
    </div>
    <div class="ag-table-wrap">
      <table class="ag-table"><thead>${head}</thead><tbody>${body}</tbody></table>
    </div>
  </div>`;
}

/* =========================================================================
   MODALS / TOAST
   ========================================================================= */
function toast(msg){
  const c=document.getElementById("toasts");
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  c.appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(()=>el.remove(),300); }, 1900);
}
function modal(html){
  return new Promise(resolve=>{
    const ov=document.createElement("div"); ov.className="overlay"; ov.innerHTML=`<div class="modal">${html}</div>`;
    document.body.appendChild(ov);
    ov._resolve=v=>{ ov.remove(); resolve(v); };
    ov.addEventListener("click",e=>{ if(e.target===ov) ov._resolve(null); });
    ov.querySelectorAll("[data-mres]").forEach(b=>b.addEventListener("click",()=>{
      const v=b.dataset.mres;
      if(v==="__input__"){ const inp=ov.querySelector("input"); ov._resolve(inp?inp.value:null); }
      else ov._resolve(v==="null"?null:v);
    }));
    const inp=ov.querySelector("input"); if(inp){ inp.focus(); inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ ov._resolve(inp.value);} }); }
  });
}
function modalForm(html){
  return new Promise(resolve=>{
    const ov=document.createElement("div"); ov.className="overlay"; ov.innerHTML=`<div class="modal">${html}</div>`;
    document.body.appendChild(ov);
    const done=v=>{
      const form={}; ov.querySelectorAll("select[id],input[id]").forEach(el=>{ form[el.id]=el.value; });
      ov.remove(); resolve({res:v, form});
    };
    ov.addEventListener("click",e=>{ if(e.target===ov) done(null); });
    ov.querySelectorAll("[data-mres]").forEach(b=>b.addEventListener("click",()=>done(b.dataset.mres==="null"?null:b.dataset.mres)));
  });
}
function confirmDialog(msg){
  return modal(`<h3>Confirmar</h3><p>${esc(msg)}</p>
    <div class="modal-actions"><button class="btn ghost" data-mres="null">Cancelar</button><button class="btn" data-mres="ok">Confirmar</button></div>`)
    .then(v=>v==="ok");
}
function promptDialog(msg,val){
  return modal(`<h3>${esc(msg)}</h3><input type="text" value="${esc(val||"")}" placeholder="Digite aqui">
    <div class="modal-actions"><button class="btn ghost" data-mres="null">Cancelar</button><button class="btn" data-mres="__input__">Salvar</button></div>`);
}

/* =========================================================================
   ACTIONS
   ========================================================================= */
function m(){ return curMeses()[curMonth]; }

async function addAluno(){
  const nome=await promptDialog("Nome do aluno:");
  if(nome==null) return;
  const t=capitalizaNome(nome.trim());
  if(t===""){ toast("Informe um nome."); return; }
  if(nomeExiste(m(),t,null)){ toast("Já existe um aluno com esse nome neste mês."); return; }
  m().alunos.push({id:uid(),nome:t,diasSemana:null,valor:null,formaPagamento:"",status:"PENDENTE",valorManual:false});
  sortAlunos(m()); touch(); toast("Aluno adicionado.");
  renderMonthRefresh();
}
async function delAluno(id){
  const a=m().alunos.find(x=>x.id===id); if(!a) return;
  if(!await confirmDialog(`Deseja realmente excluir "${a.nome}"? Esta ação não poderá ser desfeita.`)) return;
  m().alunos=m().alunos.filter(x=>x.id!==id); touch(); toast("Aluno removido.");
  renderMonthRefresh();
}
async function setAlunoStatus(id,status){
  const a=m().alunos.find(x=>x.id===id); if(!a) return;
  if(a.status===status) return;   // já está nesse estado — evita toque acidental
  const nome=(a.nome||"").trim()||"este aluno";
  const msg = status==="PAGO"
    ? `Confirmar PAGAMENTO de ${nome}?`
    : `Reabrir o pagamento de ${nome} (deixar em ABERTO)?`;
  if(!await confirmDialog(msg)) return;
  a.status=status;
  if(status==="PAGO" && !a.formaPagamento) toast("Selecione a forma de pagamento.");
  touch(); renderMonthRefresh();
}
function setAlunoDias(id,val){
  const a=m().alunos.find(x=>x.id===id); if(!a) return;
  if(val===""){ a.diasSemana=null; a.valor=null; a.valorManual=false; }
  else { const n=parseInt(val,10); a.diasSemana=n; a.valor=state.config[n]; a.valorManual=false; }
  touch(); renderMonthRefresh();
}
function setAlunoForma(id,val){ const a=m().alunos.find(x=>x.id===id); if(!a) return; a.formaPagamento=val; touch(); renderMonthRefresh(); }
function setAlunoValorLive(id,val){
  const a=m().alunos.find(x=>x.id===id); if(!a) return;
  const c=parseCents(val);
  if(c!=null && c<0){ return; }
  a.valor = c; a.valorManual=true; touch(); refreshComputed();
}
function commitAlunoNome(id,val){
  const a=m().alunos.find(x=>x.id===id); if(!a) return;
  const t=capitalizaNome((val||"").trim());
  if(t===""){ toast("O nome não pode ficar vazio."); renderAlunosList(); return; }
  if(nomeExiste(m(),t,id)){ toast("Já existe um aluno com esse nome neste mês."); renderAlunosList(); return; }
  a.nome=t; sortAlunos(m()); touch(); renderAlunosList();
}

async function encerrarMes(){
  if(curMonth>=11){ toast("Dezembro não tem próximo mês nesta versão."); return; }
  const dest=curMonth+1;
  const src=m();
  if(src.alunos.length===0){ toast("Não há alunos para migrar."); return; }
  if(!await confirmDialog(`Encerrar ${MESES[curMonth]} e migrar ${src.alunos.length} aluno(s) para ${MESES[dest]}? Todos entrarão como PENDENTE, pagamento em aberto.`)) return;
  const meses=curMeses();
  if(meses[dest].alunos.length>0){
    if(!await confirmDialog(`O mês ${MESES[dest]} já tem ${meses[dest].alunos.length} aluno(s). Eles serão SUBSTITUÍDOS pelos alunos de ${MESES[curMonth]}. Continuar?`)) return;
  }

function delDespesa(id){ m().despesas=m().despesas.filter(d=>d.id!==id); touch(); renderMonthRefresh(); }

function setDespValorLive(id,val){ const d=m().despesas.find(x=>x.id===id); if(!d) return; const c=parseCents(val); if(c!=null&&c<0) return; d.valor=c||0; touch(); refreshComputed(); }

/* ---- Migração de despesas para o próximo mês ---- */
function padParc(orig,n){ return String(n).padStart(orig.length>1?2:1,"0"); }
/* Incrementa a ÚLTIMA parcela no formato NN/NN do texto (ex.: 07/12 → 08/12) */
function incrementaParcela(desc){
  return desc.replace(/(\d{1,2})\/(\d{1,2})(?!.*\d\/\d)/, (m,a,b)=> padParc(a, parseInt(a,10)+1) + "/" + b);
}
function migraLabelTexto(){ return curMonth===11 ? "Janeiro de "+(curYear+1) : MESES[curMonth+1]; }
async function migrarDespesas(){
  const nextYear = curMonth===11 ? curYear+1 : curYear;
  const nextMonth = curMonth===11 ? 0 : curMonth+1;
  const dest = getAno(nextYear).meses[nextMonth];
  const destLabel = migraLabelTexto();
  const src = m().despesas.filter(despesaValida);
  if(src.length===0){ toast("Não há despesas para migrar."); return; }
  const destValidas = dest.despesas.filter(despesaValida);
  if(destValidas.length>0){
    if(!await confirmDialog(`${destLabel} já tem ${destValidas.length} despesa(s). Elas serão mantidas e as despesas migradas serão ADICIONADAS. Continuar?`)) return;
  }
  const aAdicionar = [], encerradas = [];
  for(const d of src){
    if(/feira|carne/i.test(d.descricao)){
      const t=d.descricao.replace(/\s*(\d{1,2})\/(\d{1,2})\s*$/,"").trim();
      aAdicionar.push({...d, id:uid(), descricao:(t||d.descricao).trim(), status:"PENDENTE"});
    } else if(/(\d{1,2})\/(\d{1,2})/.test(d.descricao)){
      const last=[...d.descricao.matchAll(/(\d{1,2})\/(\d{1,2})/g)].pop();
      const a=parseInt(last[1],10), b=parseInt(last[2],10);
      if(a>=b) encerradas.push({d,a,b});
      else aAdicionar.push({...d, id:uid(), descricao:incrementaParcela(d.descricao), status:"PENDENTE"});
    } else {
      aAdicionar.push({...d, id:uid(), status:"PENDENTE"});
    }
  }
  for(const {d,a,b} of encerradas){
    const r=await modal(`<h3>Última parcela</h3>
      <p><b>${esc(d.descricao)}</b> é a última parcela (${a}/${b}) e foi paga neste mês.</p>
      <p>Confirma que em <b>${destLabel}</b> <b>NÃO</b> haverá essa despesa?</p>
      <div class="modal-actions">
        <button class="btn ghost" data-mres="null">Cancelar</button>
        <button class="btn secondary" data-mres="sim">Confirmo, não terá</button>
        <button class="btn" data-mres="nao">Não, terá sim</button>
      </div>`);
    if(r==="nao") aAdicionar.push({...d, id:uid(), descricao:incrementaParcela(d.descricao), status:"PENDENTE"});
  }
  if(aAdicionar.length===0){ toast("Nenhuma despesa migrada."); return; }
  dest.despesas.push(...aAdicionar);
  touch(); toast(`${aAdicionar.length} despesa(s) migrada(s) para ${destLabel}.`);
  render();
}

function delReceita(id){ m().receitasExtras=m().receitasExtras.filter(r=>r.id!==id); touch(); renderMonthRefresh(); }

/* Backup — helpers de lembrete */
function temDados(){
  const anos=(state.anos)?Object.values(state.anos):[];
  for(const ano of anos){
    for(const m of ((ano&&ano.meses)||[])){
      if((m.alunos&&m.alunos.length)||(m.receitasExtras&&m.receitasExtras.length)||(m.despesas&&m.despesas.length)) return true;
    }
  }
  return false;
}
function diasDesde(iso){
  if(!iso) return Infinity;
  const t=Date.parse(iso); if(isNaN(t)) return Infinity;
  return Math.floor((Date.now()-t)/86400000);
}
function fmtDataHora(iso){
  if(!iso) return null;
  const d=new Date(iso); if(isNaN(d.getTime())) return null;
  return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}
function backupInfoHTML(){
  const last=state.meta&&state.meta.lastBackup;
  const dias=diasDesde(last);
  const quando=fmtDataHora(last);
  if(!last){
    return `<div class="reminder warn">🔔 <b>Você ainda não guardou nenhum backup.</b> Toque em <b>Guardar backup</b> e salve na sua pasta do iCloud (“Backups Gestão Sara Santos Pilates”).</div>`;
  }
  if(backupFeitoHoje()){
    return `<div class="reminder ok">✓ Backup de hoje guardado: <b>${quando}</b>. Tudo em dia!</div>`;
  }
  if(dias>=1){
    return `<div class="reminder warn">🔔 <b>Você não faz backup há ${dias} dia(s)</b> (último: ${quando}). Toque em <b>Guardar backup</b> e salve no iCloud.</div>`;
  }
  return `<div class="reminder ok">✓ Último backup: <b>${quando}</b>. Mantenha o hábito de guardar periodicamente.</div>`;
}
function avisaAtualizacao(){
  try{
    const prev = localStorage.getItem("ssp_app_version");
    if(prev && prev!==APP_VERSION){
      setTimeout(()=>toast("Aplicativo atualizado para a versão "+APP_VERSION+" ✨"), 900);
    }
    localStorage.setItem("ssp_app_version", APP_VERSION);
  }catch(e){ /* sem localStorage neste modo: ignora */ }
}
function hojeStr(){ const n=new Date(); return `${n.getFullYear()}-${pad2(n.getMonth()+1)}-${pad2(n.getDate())}`; }
function backupFeitoHoje(){
  const last=state.meta&&state.meta.lastBackup; if(!last) return false;
  const d=new Date(last); if(isNaN(d.getTime())) return false;
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`===hojeStr();
}
let lembreteBackupSessao=false;   // no máximo um lembrete por sessão
/* Lembrete diário às 18h (com o app aberto): pede para tocar em "Guardar backup".
   Antes das 18h só lembra se já estiver 2+ dias sem backup. Nunca faz download automático. */
function checkLembreteBackup(force){
  try{
    if(!state||!state.meta) return;
    if(!temDados()) return;
    if(backupFeitoHoje()) return;                        // já guardou backup hoje
    if(lembreteBackupSessao) return;                     // evita spam na mesma sessão
    const dias=diasDesde(state.meta.lastBackup);
    const now=new Date();
    const atrasado=(dias===Infinity)||(dias>=2);
    if(!force && now.getHours()<18 && !atrasado) return; // regra das 18h (ou já muito atrasado)
    // no máximo um lembrete por dia, mesmo reabrindo o app:
    try{ if(localStorage.getItem("ssp_lembrete_dia")===hojeStr()) return; }catch(e){}
    lembreteBackupSessao=true;
    try{ localStorage.setItem("ssp_lembrete_dia", hojeStr()); }catch(e){}
    const msg=(dias===Infinity)
      ? "Está na hora do backup diário (após as 18h) e você ainda não guardou nenhum backup. Guardar agora no iCloud?"
      : (dias>=1
          ? `Está na hora do backup diário. Você não faz backup há ${dias} dia(s). Guardar agora no iCloud?`
          : "Lembrete das 18h: guardar o backup de hoje no iCloud agora?");
    // Após as 18h, dispara o backup automaticamente: o iOS exige um toque para abrir
    // "Salvar em Arquivos", então confirmamos e abrimos a folha de compartilhamento.
    setTimeout(async ()=>{
      try{
        const ok=await confirmDialog(msg);
        if(ok) await guardarBackupShare();
      }catch(e){ console.warn("Auto-backup 18h falhou:", e); }
    }, 900);
  }catch(e){ console.warn("Lembrete de backup falhou:", e); }
}

/* Backup */
function exportBackup(auto){
  const suffix = auto ? "-auto" : "";
  const data=JSON.stringify({app:"pilates-manager",version:1,exportedAt:new Date().toISOString(),state},null,2);
  const blob=new Blob([data],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=fmtBackupName();
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  if(!state.meta) state.meta={};
  state.meta.lastBackup=new Date().toISOString();
  touch();
  toast(auto ? "Backup automático das 18h gerado." : "Backup exportado.");
  if(view==="config") render();
}
/* Guardar backup FORA do iPad via folha de compartilhamento do iOS (iCloud/Arquivos).
   Ordem: 1) Web Share com ARQUIVO (ideal); 2) Web Share só com TEXTO; 3) fallback texto/local. */
function backupPayload(){
  return JSON.stringify({app:"pilates-manager",version:1,exportedAt:new Date().toISOString(),state},null,2);
}
/* Nome do arquivo com a data no INÍCIO (AAAA.MM.DD) — assim a lista fica em ordem
   alfabética = ordem cronológica dentro da pasta do iCloud. */
function fmtBackupName(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"."+p(d.getMonth()+1)+"."+p(d.getDate())+"-backup-pilates.json";
}
function marcaBackupFeito(){
  if(!state.meta) state.meta={};
  state.meta.lastBackup=new Date().toISOString();
  lembreteBackupSessao=true;                 // não lembra de novo nesta sessão
  try{ localStorage.setItem("ssp_lembrete_dia", hojeStr()); }catch(e){}
  touch();
  if(view==="config") render();
}
async function guardarBackupShare(){
  const data=backupPayload();
  const fname=fmtBackupName();
  // 1) Web Share API com ARQUIVO — abre a folha → "Salvar em Arquivos" → iCloud Drive
  try{
    if(navigator.share && navigator.canShare){
      const file=new File([data], fname, {type:"application/json"});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:"Backup Sara Santos Pilates"});
        marcaBackupFeito();
        toast("Backup pronto — escolha “Salvar em Arquivos” → iCloud Drive.");
        return;
      }
    }
  }catch(err){
    if(err && err.name==="AbortError"){ toast("Compartilhamento cancelado."); return; }
    console.warn("Share com arquivo indisponível:", err);
  }
  // 2) Web Share API só com TEXTO (quando arquivos não são suportados)
  try{
    if(navigator.share){
      await navigator.share({title:"Backup Sara Santos Pilates", text:data});
      marcaBackupFeito();
      toast("Backup compartilhado como texto.");
      return;
    }
  }catch(err){
    if(err && err.name==="AbortError"){ toast("Compartilhamento cancelado."); return; }
    console.warn("Share com texto indisponível:", err);
  }
  // 3) Fallback final: reutiliza o backup por texto já existente (copiar/colar) — nunca quebra
  backupComoTexto();
  toast("Compartilhamento indisponível neste navegador — backup gerado abaixo para copiar.");
  if(view==="config") render();
}
async function importFromString(text){
  try{
    const parsed=JSON.parse(text);
    const newState=parsed.state?parsed.state:parsed;
    // aceita tanto o formato novo (anos) quanto o antigo (meses)
    const valido = newState && typeof newState==="object" && (("anos" in newState) || ("meses" in newState) || ("config" in newState));
    if(!valido) throw new Error("Formato inválido");
    if(!await confirmDialog("A importação substituirá os dados atuais. Deseja continuar?")) return false;
    state=newState; ensureShape(); await persistNow(); setSaved(true);
    toast("Backup restaurado."); render();
    return true;
  }catch(err){ toast("Backup inválido: verifique se o texto foi copiado por completo."); return false; }
}
function importBackup(){
  const inp=document.getElementById("importFile"); if(!inp) return;
  inp.value="";
  inp.onchange=async ()=>{
    const file=inp.files&&inp.files[0]; if(!file) return;
    const text=await file.text();
    await importFromString(text);
  };
  inp.click();
}
/* ---- Migração por texto (para navegadores que bloqueiam download, ex.: Documents/Readdle) ---- */
function backupComoTexto(){
  const data=JSON.stringify({app:"pilates-manager",version:1,exportedAt:new Date().toISOString(),state},null,2);
  const ta=document.getElementById("backupText");
  if(ta){ ta.value=data; ta.focus(); ta.select(); }
  let copiado=false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(data); copiado=true; }
    else if(document.execCommand){ copiado=document.execCommand("copy"); }
  }catch(e){ /* fallback manual abaixo */ }
  if(!state.meta) state.meta={};
  state.meta.lastBackup=new Date().toISOString(); touch();
  toast(copiado ? "Backup copiado! Cole no destino." : "Backup gerado. Selecione tudo e copie manualmente.");
}
async function importarDeTexto(){
  const ta=document.getElementById("importText");
  const txt=(ta && ta.value||"").trim();
  if(!txt){ toast("Cole o texto do backup na caixa antes de importar."); return; }
  await importFromString(txt);
}

/* =========================================================================
   EVENT DELEGATION
   ========================================================================= */
function bindEvents(){
  const app=document.getElementById("app");

  document.getElementById("nav").addEventListener("click",e=>{
    const b=e.target.closest("button[data-view]"); if(!b) return;
    view=b.dataset.view;
    if(view==="agenda") agWeekMon=mondayOf(new Date());   // sempre abre na semana atual
    render();
  });

  const ys=document.getElementById("yearSel");
  if(ys) ys.addEventListener("change",e=>{ curYear=parseInt(e.target.value,10); getAno(curYear); touch(); render(); });

  const cfgBtn=document.getElementById("cfgBtn");
  if(cfgBtn) cfgBtn.addEventListener("click",()=>{ view="config"; render(); });

  app.addEventListener("click",async e=>{
    const el=e.target.closest("[data-action]"); if(!el) return;
    const act=el.dataset.action, id=el.dataset.id;
    switch(act){
      case "goto-mes": curMonth=parseInt(el.dataset.i,10); view="alunos"; render(); break;
      case "mes-prev": if(curMonth>0){curMonth--; render();} break;
      case "mes-next": if(curMonth<11){curMonth++; render();} break;
      case "add-aluno": addAluno(); break;
      case "aluno-del": delAluno(id); break;
      case "aluno-status": setAlunoStatus(id, el.dataset.status); break;
      case "add-desp": addDespesa(); break;
      case "migrar-despesas": await migrarDespesas(); break;
      case "desp-del": delDespesa(id); break;
      case "desp-status": toggleDespesa(id); break;
      case "add-rec": addReceita(); break;
      case "rec-del": delReceita(id); break;
      case "add-poup-dep": addPoupanca("DEP"); break;
      case "add-poup-saque": addPoupanca("SAQUE"); break;
      case "poup-del": delPoupanca(id); break;
      case "encerrar": encerrarMes(); break;
      case "backup-share": await guardarBackupShare(); break;
      case "export": exportBackup(); break;
      case "import": importBackup(); break;
      case "save-now": await persistNow(); setSaved(true); toast("Dados salvos."); break;
      case "app-reload": location.reload(); break;
      case "backup-text": backupComoTexto(); break;
      case "import-text": await importarDeTexto(); break;
      case "sem-prev": agWeekMon=addDays(agWeekMon,-7); render(); break;
      case "sem-next": agWeekMon=addDays(agWeekMon,7); render(); break;
      case "agenda-fechar": agendaFecharDialog(); break;
      case "agenda-abrir": agendaAbrirDialog(); break;
      case "agenda-migrar": agendaMigrar(); break;
      case "agenda-att": {
        const st=cycleAgAttend(+el.dataset.day, el.dataset.time, +el.dataset.line);
        el.classList.toggle("on", st==="on"); el.classList.toggle("off", st==="off");
        const line=el.closest(".ag-line");
        if(line){ line.classList.toggle("att-on", st==="on"); line.classList.toggle("att-off", st==="off"); }
        break;
      }
    }
  });

  app.addEventListener("change",e=>{
    const el=e.target.closest("[data-field]"); if(!el) return;
    const f=el.dataset.field, id=el.dataset.id;
    if(f==="mes-sel"){ curMonth=parseInt(el.value,10); render(); }
    else if(f==="aluno-nome"){ commitAlunoNome(id, el.value); }
    else if(f==="aluno-dias"){ setAlunoDias(id, el.value); }
    else if(f==="aluno-valor"){ renderMonthRefresh(); }        // reformat
    else if(f==="aluno-forma"){ setAlunoForma(id, el.value); }
    else if(f==="desp-valor"){ renderMonthRefresh(); }
    else if(f==="rec-valor"){ renderMonthRefresh(); }
    else if(f==="poup-valor"){ reformatPoupValor(id); }
    else if(f==="cfg"){ setConfig(parseInt(el.dataset.dias,10), el.value); }
  });

  app.addEventListener("input",e=>{
    const el=e.target.closest("[data-live]"); if(!el) return;
    const k=el.dataset.live, id=el.dataset.id;
    if(k==="search"){ renderAlunosList(); }
    else if(k==="aluno-valor"){ setAlunoValorLive(id, el.value); }
    else if(k==="desp-desc"){ setDespDescLive(id, el.value); }
    else if(k==="desp-valor"){ setDespValorLive(id, el.value); }
    else if(k==="rec-desc"){ setRecDescLive(id, el.value); }
    else if(k==="rec-valor"){ setRecValorLive(id, el.value); }
    else if(k==="poup-desc"){ setPoupDescLive(id, el.value); }
    else if(k==="poup-valor"){ setPoupValorLive(id, el.value); }
    else if(k==="agenda-cell"){ setAgendaName(parseInt(el.dataset.day,10), el.dataset.time, parseInt(el.dataset.line,10), el.value); }
  });

  // Destaque cruzado (linha + coluna) da Agenda ao focar uma célula
  app.addEventListener("focusin",e=>{
    const tbl=document.querySelector(".ag-table"); if(!tbl) return;
    tbl.querySelectorAll(".ag-hl-col,.ag-hl-row,.ag-hl-head,.ag-hl-line").forEach(el=>el.classList.remove("ag-hl-col","ag-hl-row","ag-hl-head","ag-hl-line"));
    const inp=e.target.closest(".ag-name"); if(!inp) return;
    const d=inp.dataset.day, t=inp.dataset.time;
    tbl.querySelectorAll('[data-day="'+d+'"]').forEach(el=>el.classList.add("ag-hl-col"));
    tbl.querySelectorAll('[data-time="'+t+'"]').forEach(el=>el.classList.add("ag-hl-row"));
    const dh=tbl.querySelector('th.ag-day[data-day="'+d+'"]'); if(dh) dh.classList.add("ag-hl-head");
    const th=tbl.querySelector('th.ag-time[data-time="'+t+'"]'); if(th) th.classList.add("ag-hl-head");
    const line=inp.closest(".ag-line"); if(line) line.classList.add("ag-hl-line");
  });
  app.addEventListener("focusout",e=>{
    const tbl=document.querySelector(".ag-table"); if(!tbl) return;
    const to=e.relatedTarget;
    if(to && tbl.contains(to)) return;   // ainda dentro da tabela
    tbl.querySelectorAll(".ag-hl-col,.ag-hl-row,.ag-hl-head,.ag-hl-line").forEach(el=>el.classList.remove("ag-hl-col","ag-hl-row","ag-hl-head","ag-hl-line"));
  });
}

/* =========================================================================
   BOOT
   ========================================================================= */
(async function boot(){
  // 1) UI SEMPRE aparece primeiro (dados default em memória) — nunca fica em branco,
  //    mesmo que o armazenamento local demore ou falhe (ex.: pré-visualização do iPad).
  initState();
  bindEvents();
  render();
  setSaved(true);
  avisaAtualizacao();                         // avisa se a versão publicada mudou desde a última abertura
  setInterval(checkLembreteBackup, 5*60*1000);   // verifica o lembrete de backup das 18h a cada 5 min

  // 2) Tenta IndexedDB com timeout (não trava a tela). Se abrir, carrega os dados salvos.
  try{
    db = await withTimeout(openDB(), 2000);
    storageMode = "idb";
    const s = await withTimeout(dbGet("state"), 2000);
    if(s){ state = s; ensureShape(); render(); }
    else { await persistNow(); }
    checkLembreteBackup();
    return;
  }catch(err){ db = null; console.warn("IndexedDB indisponível:", err); }

  // 3) Fallback: localStorage (funciona em mais contextos que o IndexedDB).
  try{
    localStorage.setItem("__pilates_probe", "1"); localStorage.removeItem("__pilates_probe");
    storageMode = "ls";
    const raw = localStorage.getItem("pilates_state");
    if(raw){ state = JSON.parse(raw); ensureShape(); render(); }
    else { persistNow(); }
    checkLembreteBackup();
    return;
  }catch(err){ console.warn("localStorage indisponível:", err); }

  // 4) Último caso: só memória (sessão). Avisa para usar backup.
  storageMode = "mem";
  setTimeout(()=>toast("Sem armazenamento local neste modo — use Exportar/Importar backup."), 600);
})();
</script>
